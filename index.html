<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><title>AR Washing Machine</title><script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script><script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script><style>body{margin:0;overflow:hidden;font-family:Arial}#ui{position:fixed;bottom:10px;left:10px;z-index:9999;display:flex;flex-wrap:wrap;gap:5px}button{padding:10px 14px;border:none;border-radius:8px;background:#1976d2;color:#fff}#status{width:100%;background:rgba(0,0,0,.75);color:#fff;padding:10px;border-radius:8px}</style></head><body><div id="ui"><button onclick="startWash()">▶ Start</button><button onclick="stopWash()">■ Stop</button><button onclick="increaseSpeed()">➕ Speed</button><button onclick="decreaseSpeed()">➖ Speed</button><button onclick="toggleLid()">🧺 Open/Close Lid</button><div id="status">Speed : <span id="speedText">1</span>x<br>Status : <span id="runText">Stopped</span></div></div><a-scene embedded vr-mode-ui="enabled:false" renderer="logarithmicDepthBuffer:true" arjs="sourceType:webcam;debugUIEnabled:false;"><a-marker preset="hiro"><a-box position="0 0.5 0" width="1" height="1" depth="1" color="#ECEFF1"></a-box><a-entity id="lidPivot" position="0 1 0.5"><a-box id="lid" position="0 0 -0.5" width="1" height="0.05" depth="1" color="#90CAF9"></a-box></a-entity><a-cylinder id="drum" position="0 0.5 0" radius="0.32" height="0.7" color="#546E7A"></a-cylinder><a-text value="Washing Machine" color="blue" position="-0.65 1.3 0"></a-text></a-marker><a-entity camera></a-entity></a-scene><script>let speed=1,isRunning=false,lidOpen=false;const speedText=document.getElementById('speedText'),runText=document.getElementById('runText');function updateUI(){speedText.innerText=speed;runText.innerText=isRunning?'Running':'Stopped'}function startWash(){isRunning=true;updateUI()}function stopWash(){isRunning=false;updateUI()}function increaseSpeed(){if(speed<10)speed++;updateUI()}function decreaseSpeed(){if(speed>1)speed--;updateUI()}function toggleLid(){const pivot=document.querySelector('#lidPivot');lidOpen=!lidOpen;pivot.setAttribute('rotation',lidOpen?'-110 0 0':'0 0 0')}AFRAME.registerComponent('washing-spin',{tick:function(t,d){if(!isRunning)return;const r=this.el.getAttribute('rotation');r.y+=speed*d*0.02;this.el.setAttribute('rotation',r)}});window.addEventListener('load',()=>{document.querySelector('#drum').setAttribute('washing-spin','');updateUI();});</script></body></html>
